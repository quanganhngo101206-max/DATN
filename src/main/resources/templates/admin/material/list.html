<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý chất liệu - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('material')}"></div>

<div class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-bold mb-0">Quản lý chất liệu</h4>
        <button type="button" class="btn btn-purple" data-bs-toggle="modal" data-bs-target="#materialModal"
                onclick="openCreateModal()">
            <i class="bi bi-plus-circle"></i> Thêm chất liệu
        </button>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách chất liệu</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Mã</th><th>Tên</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:each="m, i : ${materials}">
                    <td th:text="${i.count}"></td>
                    <td><span class="badge bg-secondary" th:text="${m.code}"></span></td>
                    <td th:text="${m.name}"></td>
                    <td>
                        <span class="badge bg-success" th:if="${m.status == 1}">Hoạt động</span>
                        <span class="badge bg-secondary" th:if="${m.status == 0}">Tạm dừng</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/material/edit/{id}(id=${m.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/admin/material/toggle-status/{id}(id=${m.id})}" method="post" style="display:inline">
                            <button type="submit" th:class="${m.status == 1} ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-success'"
                                    th:title="${m.status == 1} ? 'Tạm dừng' : 'Kích hoạt'"
                                    th:onclick="${m.status == 1} ? 'return confirm(\'Tạm dừng chất liệu này?\')' : null">
                                <i th:class="${m.status == 1} ? 'bi bi-pause-fill' : 'bi bi-play-fill'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(materials)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có chất liệu nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal thêm / sửa chất liệu -->
<div class="modal fade" id="materialModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="${material.id != null} ? '/admin/material/update' : '/admin/material/save'" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle"></i>
                        <span th:text="${material.id != null} ? 'Sửa chất liệu' : 'Thêm chất liệu'"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" th:value="${material.id}"/>
                    <input type="hidden" name="deleteFlag" th:value="${material.deleteFlag}"/>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mã chất liệu</label>
                        <input type="text" name="code" class="form-control" th:value="${material.code}" placeholder="VD: COTTON, POLY..." required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên chất liệu</label>
                        <input type="text" name="name" class="form-control" th:value="${material.name}" placeholder="VD: Cotton, Polyester..." required/>
                    </div>
                    <p class="text-muted small mb-0" th:if="${material.id == null}">
                        <i class="bi bi-info-circle"></i> Chất liệu mới sẽ ở trạng thái Tạm dừng, hãy bật hoạt động sau khi tạo.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            th:onclick="${material.id != null} ? 'window.location=\'/admin/material\'' : ''">Hủy</button>
                    <button type="submit" class="btn btn-purple">
                        <i class="bi bi-save"></i>
                        <span th:text="${material.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
<script th:inline="javascript">
    function openCreateModal() {
        var form = document.querySelector('#materialModal form');
        form.reset();
        form.setAttribute('action', '/admin/material/save');
        form.querySelector('input[name=id]').value = '';
        document.querySelector('#materialModal .modal-title span').textContent = 'Thêm chất liệu';
    }

    /*<![CDATA[*/
    var shouldOpenModal = /*[[${openModal != null && openModal}]]*/ false;
    /*]]>*/
    if (shouldOpenModal) {
        document.addEventListener('DOMContentLoaded', function () {
            new bootstrap.Modal(document.getElementById('materialModal')).show();
        });
    }
</script>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
