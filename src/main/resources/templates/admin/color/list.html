<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý màu sắc - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('color')}"></div>

<div class="main-content">
    <h4 class="fw-bold mb-4">Quản lý màu sắc</h4>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-plus-circle"></i>
                    <span th:text="${color.id != null} ? 'Sửa màu sắc' : 'Thêm màu sắc'"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${color.id != null} ? '/admin/color/update' : '/admin/color/save'" method="post">
                        <input type="hidden" name="id" th:value="${color.id}"/>
                        <input type="hidden" name="deleteFlag" th:value="${color.deleteFlag}"/>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã màu</label>
                            <input type="text" name="code" class="form-control" th:value="${color.code}" placeholder="VD: DO, XANH..." required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên màu</label>
                            <input type="text" name="name" class="form-control" th:value="${color.name}" placeholder="VD: Đỏ, Xanh..." required/>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">
                            <i class="bi bi-save"></i>
                            <span th:text="${color.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                        </button>
                        <a th:if="${color.id != null}" href="/admin/color" class="btn btn-secondary w-100 mt-2">Hủy</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách màu sắc</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>#</th><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c, i : ${colors}">
                            <td th:text="${i.count}"></td>
                            <td><span class="badge bg-secondary" th:text="${c.code}"></span></td>
                            <td th:text="${c.name}"></td>
                            <td>
                                <a th:href="@{/admin/color/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/admin/color/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa màu này?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(colors)}">
                            <td colspan="4" class="text-center text-muted py-4">Chưa có màu nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
</body>
</html>
