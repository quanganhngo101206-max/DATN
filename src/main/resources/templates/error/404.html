<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy - SkySport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .error-card {
      text-align: center;
      padding: 60px 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      max-width: 480px;
      width: 90%;
    }
    .error-code {
      font-size: 100px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-title {
      font-size: 24px;
      font-weight: 600;
      margin: 16px 0 8px;
    }
    .error-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-home:hover { opacity: 0.85; color: #fff; }
  </style>
</head>
<body>
<div class="error-card">
  <div class="error-code">404</div>
  <div class="error-title">Trang không tồn tại</div>
  <div class="error-desc">Trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển.</div>
  <a href="/home" class="btn-home">
    <i class="bi bi-house"></i> Về trang chủ
  </a>
</div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
