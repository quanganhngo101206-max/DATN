<div th:fragment="chatbot">
    <style>
        /* Nút toggle mở chat */
        .chatbot-toggler {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chatbot-toggler:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Khung chat */
        .chatbot-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            max-width: calc(100vw - 60px);
            height: 500px;
            max-height: calc(100vh - 120px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .chatbot-window.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* Header của khung chat */
        .chatbot-header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
        }
        
        .chatbot-header .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chatbot-header .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Vùng hiển thị tin nhắn */
        .chatbot-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fa;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #007bff;
            color: white;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background-color: #e9ecef;
            color: #333;
            border-bottom-right-radius: 2px;
        }

        /* Vùng nhập tin nhắn */
        .chatbot-input {
            padding: 15px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .chatbot-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chatbot-input input:focus {
            border-color: #007bff;
        }

        .chatbot-input button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chatbot-input button:hover {
            background: #0056b3;
        }
        
        .typing-indicator {
            align-self: flex-start;
            background-color: #f1f0f0;
            padding: 10px 15px;
            border-radius: 15px;
            font-style: italic;
            color: #666;
            font-size: 12px;
            display: none;
        }

        /* Product Cards trong Chatbot */
        .bot-products {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
            width: 100%;
        }

        .bot-product-card {
            display: flex;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.2s;
        }

        .bot-product-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .bot-product-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }

        .bot-product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bot-product-name {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .bot-product-price {
            font-size: 13px;
            color: #d9534f;
            font-weight: bold;
        }
    </style>

    <!-- Nút Toggle -->
    <button class="chatbot-toggler" id="chatbotToggler">
        <i class="bi bi-chat-dots"></i>
    </button>

    <!-- Khung Chat -->
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <div class="title">
                <i class="bi bi-robot"></i> Chăm Sóc Khách Hàng
            </div>
            <button class="close-btn" id="chatbotClose"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <!-- Lời chào mặc định -->
            <div class="message bot">
                Chào bạn! Rất vui được gặp bạn. Mình có thể giúp gì cho bạn hôm nay? 😊
            </div>
            <div class="typing-indicator" id="chatbotTyping">Đang gõ...</div>
        </div>
        <div class="chatbot-input">
            <input type="text" id="chatbotInput" placeholder="Gửi Tin Nhắn..." autocomplete="off">
            <button id="chatbotSend"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggler = document.getElementById('chatbotToggler');
            const windowEl = document.getElementById('chatbotWindow');
            const closeBtn = document.getElementById('chatbotClose');
            const inputField = document.getElementById('chatbotInput');
            const sendBtn = document.getElementById('chatbotSend');
            const messagesContainer = document.getElementById('chatbotMessages');
            const typingIndicator = document.getElementById('chatbotTyping');

            // Toggle Chat Window
            toggler.addEventListener('click', () => {
                windowEl.classList.toggle('show');
                if (windowEl.classList.contains('show')) {
                    inputField.focus();
                }
            });

            closeBtn.addEventListener('click', () => {
                windowEl.classList.remove('show');
            });

            // Send Message Function
            const sendMessage = async () => {
                const message = inputField.value.trim();
                if (!message) return;

                // Thêm tin nhắn user vào UI
                addMessage(message, 'user');
                inputField.value = '';

                // Hiển thị trạng thái đang gõ
                typingIndicator.style.display = 'block';
                scrollToBottom();

                try {
                    const response = await fetch('/api/chatbot/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: message })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        typingIndicator.style.display = 'none';
                        addMessage(data.reply, 'bot', data.products);
                    } else {
                        typingIndicator.style.display = 'none';
                        addMessage("Xin lỗi, hệ thống đang bận. Vui lòng thử lại sau! 😢", 'bot');
                    }
                } catch (error) {
                    typingIndicator.style.display = 'none';
                    addMessage("Lỗi kết nối máy chủ! 🔌", 'bot');
                }
            };

            const addMessage = (text, sender, products = null) => {
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                if (sender === 'user') wrapper.style.alignItems = 'flex-end';
                else wrapper.style.alignItems = 'flex-start';
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender}`;
                msgDiv.innerText = text;
                wrapper.appendChild(msgDiv);
                
                // Hiển thị sản phẩm nếu có
                if (products && products.length > 0) {
                    const productsContainer = document.createElement('div');
                    productsContainer.className = 'bot-products';
                    
                    products.forEach(p => {
                        const productCard = document.createElement('a');
                        productCard.href = `/chi-tiet-san-pham/${p.id}`; // Đường dẫn mẫu tới trang chi tiết
                        productCard.className = 'bot-product-card';
                        productCard.innerHTML = `
                            <img src="${p.image}" alt="${p.name}" onerror="this.src='/assets/images/default-product.jpg'">
                            <div class="bot-product-info">
                                <div class="bot-product-name">${p.name}</div>
                                <div class="bot-product-price">${p.price}</div>
                            </div>
                        `;
                        productsContainer.appendChild(productCard);
                    });
                    
                    wrapper.appendChild(productsContainer);
                }

                // Chèn trước typing indicator
                messagesContainer.insertBefore(wrapper, typingIndicator);
                scrollToBottom();
            };

            const scrollToBottom = () => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            };

            // Event Listeners for sending
            sendBtn.addEventListener('click', sendMessage);
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</div>
