<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments/layout :: staffHead(~{::title}, ~{::extraHead})}">
    <title>Đơn hàng - SkySport Staff</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{staff/fragments/layout :: staffSidebar('bill')}"></div>

<div class="main-content">
    <h4 class="fw-bold mb-4"><i class="bi bi-receipt me-2"></i>Xử lý đơn hàng</h4>

    <!-- Tabs lọc trạng thái -->
    <div class="mb-3 d-flex flex-wrap gap-1">
        <a th:href="@{/staff/bill}"
           th:class="${currentStatus == -1} ? 'btn btn-sm btn-purple' : 'btn btn-sm btn-outline-secondary'">Tất cả</a>
        <a th:href="@{/staff/bill(status=1)}"
           th:class="${currentStatus == 1} ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-outline-warning'">Chờ xác
            nhận</a>
        <a th:href="@{/staff/bill(status=2)}"
           th:class="${currentStatus == 2} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'">Đã xác
            nhận</a>
        <a th:href="@{/staff/bill(status=3)}"
           th:class="${currentStatus == 3} ? 'btn btn-sm btn-info text-white' : 'btn btn-sm btn-outline-info'">Đang
            giao</a>
        <a th:href="@{/staff/bill(status=7)}"
           th:class="${currentStatus == 7} ? 'btn btn-sm btn-success' : 'btn btn-sm btn-outline-success'">Hoàn thành</a>
        <a th:href="@{/staff/bill(status=5)}"
           th:class="${currentStatus == 5} ? 'btn btn-sm btn-danger' : 'btn btn-sm btn-outline-danger'">Đã hủy</a>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul me-2"></i>Danh sách đơn hàng</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Tổng tiền</th>
                    <th>Thanh toán</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bills}">
                    <td class="fw-bold" th:text="${b.code}"></td>
                    <td th:text="${b.customer != null ? b.customer.name : 'Khách lẻ'}"></td>
                    <td th:text="${#numbers.formatInteger(b.amount, 0, 'COMMA') + 'đ'}"></td>
                    <td th:text="${b.paymentMethod != null ? b.paymentMethod.name : '-'}"></td>
                    <td th:text="${#temporals.format(b.createDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
              <span th:switch="${b.status}">
                <span th:case="1" class="badge bg-warning text-dark">Chờ xác nhận</span>
                <span th:case="2" class="badge bg-primary">Đã xác nhận</span>
                <span th:case="3" class="badge bg-info text-dark">Đang giao</span>
                <span th:case="4" class="badge bg-secondary">Đã giao</span>
                <span th:case="5" class="badge bg-danger">Đã hủy</span>
                <span th:case="6" class="badge bg-dark">Trả hàng</span>
                <span th:case="7" class="badge bg-success">Hoàn thành</span>
              </span>
                    </td>
                    <td>
                        <a th:href="@{/staff/bill/detail/{id}(id=${b.id})}" class="btn btn-sm btn-purple">
                            <i class="bi bi-eye"></i> Xử lý
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bills)}">
                    <td colspan="7" class="text-center text-muted py-4">Không có đơn hàng nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{staff/fragments/layout :: staffScripts}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
