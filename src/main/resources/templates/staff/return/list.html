<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments/layout :: staffHead(~{::title}, ~{::extraHead})}">
    <title>Hoàn trả - SkySport Staff</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{staff/fragments/layout :: staffSidebar('return')}"></div>

<div class="main-content">
    <h4 class="fw-bold mb-4"><i class="bi bi-arrow-return-left me-2"></i>Xử lý hoàn trả</h4>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabs lọc -->
    <div class="mb-3 d-flex gap-2">
        <a th:href="@{/staff/return}"
           th:class="${currentStatus == -1} ? 'btn btn-sm btn-purple' : 'btn btn-sm btn-outline-secondary'">Tất cả</a>
        <a th:href="@{/staff/return(status=1)}"
           th:class="${currentStatus == 1} ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-outline-warning'">Chờ xử lý</a>
        <a th:href="@{/staff/return(status=2)}"
           th:class="${currentStatus == 2} ? 'btn btn-sm btn-success' : 'btn btn-sm btn-outline-success'">Đã duyệt</a>
        <a th:href="@{/staff/return(status=3)}"
           th:class="${currentStatus == 3} ? 'btn btn-sm btn-danger' : 'btn btn-sm btn-outline-danger'">Từ chối</a>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul me-2"></i>Danh sách yêu cầu hoàn trả</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã yêu cầu</th>
                    <th>Mã đơn hàng</th>
                    <th>Khách hàng</th>
                    <th>Ngày yêu cầu</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${requests}">
                    <td class="fw-bold" th:text="${r.code}"></td>
                    <td th:text="${r.bill != null ? r.bill.code : '-'}"></td>
                    <td th:text="${r.bill != null and r.bill.customer != null ? r.bill.customer.name : 'Khách lẻ'}"></td>
                    <td th:text="${#temporals.format(r.createdDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                            <span th:switch="${r.status}">
                                <span th:case="1" class="badge bg-warning text-dark">Chờ xử lý</span>
                                <span th:case="2" class="badge bg-success">Đã duyệt</span>
                                <span th:case="3" class="badge bg-danger">Từ chối</span>
                            </span>
                    </td>
                    <td>
                        <a th:href="@{/staff/return/detail/{id}(id=${r.id})}"
                           class="btn btn-sm btn-purple"><i class="bi bi-eye"></i> Xử lý</a>
                    </td>
                </tr>
                <tr th:if="${requests == null or requests.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox me-2"></i>Không có yêu cầu hoàn trả nào
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{staff/fragments/layout :: staffScripts}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
