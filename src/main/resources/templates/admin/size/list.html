<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý Size - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('size')}"></div>

<div class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-bold mb-0">Quản lý Size</h4>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách size</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Mã</th><th>Tên</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:each="s, i : ${sizes}">
                    <td th:text="${i.count}"></td>
                    <td><span class="badge bg-secondary" th:text="${s.code}"></span></td>
                    <td th:text="${s.name}"></td>
                    <td>
                        <span class="badge bg-success" th:if="${s.status == 1}">Hoạt động</span>
                        <span class="badge bg-secondary" th:if="${s.status == null or s.status == 0}">Tạm dừng</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/size/toggle-status/{id}(id=${s.id})}" method="post" style="display:inline">
                            <button type="submit" th:class="${s.status == 1} ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-success'"
                                    th:title="${s.status == 1} ? 'Tạm dừng' : 'Kích hoạt'"
                                    th:onclick="${s.status == 1} ? 'return confirm(\'Tạm dừng size này?\')' : null">
                                <i th:class="${s.status == 1} ? 'bi bi-pause-fill' : 'bi bi-play-fill'"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sizes)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có size nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
