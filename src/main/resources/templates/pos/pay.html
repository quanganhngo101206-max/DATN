<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="${isAdmin} ? ~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})} : ~{staff/fragments/layout :: staffHead(~{::title}, ~{::extraHead})}">
    <title>Thanh toán đơn POS - SkySport Staff</title>
    <th:block th:fragment="extraHead">
        <style>
            .order-line {
                display: flex;
                align-items: center;
                gap: 10px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 10px 12px;
                margin-bottom: 8px;
            }
            .order-line .qty-input { width: 68px; }

            .field-wrapper { position: relative; }
            .suggest-dropdown {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                z-index: 20;
                background: white;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                max-height: 240px;
                overflow-y: auto;
                box-shadow: 0 6px 16px rgba(0,0,0,.08);
                display: none;
            }
            .suggest-dropdown.show { display: block; }
            .suggest-item {
                padding: 8px 12px;
                cursor: pointer;
                border-bottom: 1px solid #f1f1f1;
                font-size: 13px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .suggest-item:hover { background: #f0fdf8; }
            .suggest-item:last-child { border-bottom: none; }

            .variant-badge {
                display: inline-block;
                padding: 4px 10px;
                margin: 3px 4px 3px 0;
                border: 1.5px solid var(--border);
                border-radius: 20px;
                font-size: 12px;
                cursor: pointer;
            }
            .variant-badge:hover, .variant-badge.selected {
                border-color: var(--brand-primary);
                background: var(--brand-primary);
                color: white;
            }

            .summary-box {
                background: #f0fdf8;
                border: 1.5px solid #6ee7b7;
                border-radius: var(--radius-sm);
                padding: 14px 16px;
            }

            .payment-option {
                border: 1.5px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 10px 12px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }
            .payment-option:hover { border-color: var(--brand-primary); }
            .payment-option input:checked ~ span { font-weight: 700; color: var(--brand-dark); }
        </style>
    </th:block>
</head>
<body>

<div th:replace="${isAdmin} ? ~{admin/fragments/layout :: adminSidebar('pos')} : ~{staff/fragments/layout :: staffSidebar('order')}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-cash-coin me-2"></i>Thanh toán đơn
            <span th:text="${bill.code}"></span>
        </h4>
        <a href="/pos/waiting" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách chờ
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span></div>

    <div class="row">
        <!-- CỘT TRÁI: Sản phẩm trong đơn (có thể sửa) -->
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header"><i class="bi bi-cart3 me-2"></i>Sản phẩm trong đơn</div>
                <div class="card-body">
                    <p class="mb-3">
                        <strong>Khách hàng:</strong> <span id="customerInfo">Đang tải...</span>
                    </p>

                    <div id="itemsLoading" class="text-center text-muted py-3">
                        <div class="spinner-border spinner-border-sm me-2"></div>Đang tải giỏ hàng...
                    </div>
                    <div id="orderItems" style="display:none;"></div>

                    <!-- Mã giảm giá -->
                    <div class="mb-3">
                        <label class="form-label">Mã giảm giá</label>
                        <div class="input-group">
                            <input type="text" id="payDiscountInput" class="form-control" placeholder="Nhập mã (nếu có)">
                            <button class="btn btn-outline-secondary" type="button" onclick="applyPayDiscount()">Áp dụng</button>
                            <button class="btn btn-outline-danger" type="button" id="removePayDiscountBtn"
                                    style="display:none;" onclick="removePayDiscount()">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div id="payDiscountMsg" class="mt-1" style="font-size:12px;"></div>
                    </div>

                    <hr>

                    <!-- Mua thêm sản phẩm ngay tại bước thanh toán -->
                    <div class="field-wrapper mb-2">
                        <input type="text" id="addProductSearch" class="form-control" autocomplete="off"
                               placeholder="🔍 Khách muốn mua thêm? Tìm sản phẩm tại đây...">
                        <div id="addProductSuggest" class="suggest-dropdown"></div>
                    </div>
                    <div id="addVariantPicker" class="p-2" style="display:none; border:1px dashed var(--border); border-radius:8px;">
                        <div id="addVariantList" class="mb-2"></div>
                        <div class="d-flex align-items-center gap-2" id="addVariantConfirm" style="display:none;">
                            <input type="number" id="addVariantQty" class="form-control form-control-sm qty-input" min="1" value="1">
                            <button class="btn btn-purple btn-sm" onclick="confirmAddItem()">
                                <i class="bi bi-plus-circle me-1"></i>Thêm vào đơn
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: Tổng tiền + phương thức thanh toán -->
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header"><i class="bi bi-receipt me-2"></i>Thanh toán</div>
                <div class="card-body">
                    <div class="summary-box mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Tạm tính:</span>
                            <span id="subtotalDisplay">…</span>
                        </div>
                        <div class="d-flex justify-content-between mb-1" id="discountRow" style="display:none;">
                            <span class="text-muted">Giảm giá <span id="discountCodeLabel"></span>:</span>
                            <span id="discountDisplay" class="text-danger">…</span>
                        </div>
                        <div class="d-flex justify-content-between fw-bold" style="font-size:18px;">
                            <span>Tổng cộng:</span>
                            <span id="totalDisplay" class="text-success">…</span>
                        </div>
                    </div>

                    <form th:action="@{'/pos/pay/' + ${bill.id}}" method="post" id="payForm"
                          onsubmit="return confirm('Xác nhận khách đã thanh toán đủ số tiền trên?');">
                        <label class="form-label">Phương thức thanh toán <span class="text-danger">*</span></label>
                        <div th:each="pm, iter : ${paymentMethods}">
                            <label class="payment-option">
                                <input type="radio" name="paymentMethodId" th:value="${pm.id}"
                                       th:checked="${iter.first}" required
                                       th:attr="data-name=${pm.name}"
                                       onchange="onPaymentMethodChange(this)">
                                <span th:text="${pm.name}"></span>
                            </label>
                        </div>

                        <!-- QR chuyển khoản — hiện khi chọn phương thức có "chuyển" hoặc "bank" -->
                        <div id="qrSection" class="text-center my-3 p-3" style="display:none; background:#f0fdf8; border-radius:12px; border:1.5px solid #6ee7b7;">
                            <p class="text-muted mb-2 small">Khách quét mã QR để thanh toán</p>
                            <img id="qrImage" src="" alt="QR thanh toán"
                                 style="width:200px; height:200px; border-radius:10px; border:2px solid #e2e8f0;">
                            <p class="fw-bold mt-2 mb-0" id="qrBillCode" th:text="${bill.code}"></p>
                            <p class="text-muted small">Nội dung CK: <span th:text="${bill.code}"></span></p>
                        </div>

                        <button type="submit" class="btn btn-purple w-100 py-2 mt-3">
                            <i class="bi bi-check-circle me-2"></i>Xác nhận thanh toán
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const billId = /*[[${bill.id}]]*/ 0;
    let currentAddProductId = null;
    let currentAddVariants = [];
    let selectedAddVariant = null;

    function getCsrfToken() {
        const cookie = document.cookie.split(';').find(c => c.trim().startsWith('XSRF-TOKEN='));
        return cookie ? decodeURIComponent(cookie.split('=')[1]) : null;
    }

    function csrfHeaders(extra) {
        const h = Object.assign({}, extra || {});
        const t = getCsrfToken();
        if (t) h['X-XSRF-TOKEN'] = t;
        return h;
    }

    function fmt(n) {
        return new Intl.NumberFormat('vi-VN').format(n || 0) + 'đ';
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function loadCart() {
        fetch('/pos/waiting/' + billId + '/detail')
            .then(r => {
                if (!r.ok) throw new Error('Không thể tải giỏ hàng');
                return r.json();
            })
            .then(renderCart)
            .catch(() => {
                document.getElementById('itemsLoading').innerHTML =
                    '<span class="text-danger">Không thể tải giỏ hàng. Vui lòng tải lại trang.</span>';
            });
    }

    function renderCart(dto) {
        document.getElementById('itemsLoading').style.display = 'none';
        document.getElementById('orderItems').style.display = 'block';

        document.getElementById('customerInfo').textContent =
            (dto.customerName || 'Khách lẻ') + (dto.customerPhone ? ' - ' + dto.customerPhone : '');

        let html = '';
        (dto.items || []).forEach(item => {
            html += `<div class="order-line">
                <div class="flex-grow-1">
                    <div class="fw-semibold" style="font-size:13px;">${escapeHtml(item.productName)}</div>
                    <div class="text-muted" style="font-size:12px;">${escapeHtml(item.size)} / ${escapeHtml(item.color)} — ${fmt(item.price)}</div>
                </div>
                <input type="number" class="form-control form-control-sm qty-input" min="0" max="${item.stock}"
                       value="${item.quantity}"
                       onchange="updateItemQty(${item.billDetailId}, this.value, ${item.stock})">
                <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.billDetailId})" type="button">
                    <i class="bi bi-trash"></i>
                </button>
            </div>`;
        });
        document.getElementById('orderItems').innerHTML = html || '<p class="text-muted">Đơn không còn sản phẩm nào.</p>';

        document.getElementById('subtotalDisplay').textContent = fmt(dto.subtotal);
        document.getElementById('totalDisplay').textContent = fmt(dto.amount);

        const removeBtn = document.getElementById('removePayDiscountBtn');
        const discountInput = document.getElementById('payDiscountInput');
        if (dto.discountCode) {
            discountInput.value = dto.discountCode;
            discountInput.disabled = true;
            removeBtn.style.display = 'inline-block';
        } else {
            discountInput.value = '';
            discountInput.disabled = false;
            removeBtn.style.display = 'none';
        }
        document.getElementById('payDiscountMsg').innerHTML = '';

        if (dto.promotionPrice && dto.promotionPrice > 0) {
            document.getElementById('discountRow').style.display = 'flex';
            document.getElementById('discountDisplay').textContent = '-' + fmt(dto.promotionPrice);
            document.getElementById('discountCodeLabel').textContent = dto.discountCode ? '(' + dto.discountCode + ')' : '';
        } else {
            document.getElementById('discountRow').style.display = 'none';
        }

        // Nếu đơn hết sạch sản phẩm thì không cho thanh toán 0đ
        document.getElementById('payForm').querySelector('button[type=submit]').disabled = (dto.items || []).length === 0;
    }

    function applyPayDiscount() {
        const code = document.getElementById('payDiscountInput').value.trim();
        if (!code) return;
        const msg = document.getElementById('payDiscountMsg');
        msg.innerHTML = '';

        fetch('/pos/waiting/' + billId + '/discount?code=' + encodeURIComponent(code), {
            method: 'POST',
            headers: csrfHeaders()
        })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    msg.innerHTML = '<span class="text-danger">' + escapeHtml(data.error || 'Mã giảm giá không hợp lệ!') + '</span>';
                    return;
                }
                renderCart(data);
                document.getElementById('payDiscountMsg').innerHTML =
                    '<span class="text-success">✓ Áp dụng mã giảm giá thành công!</span>';
            })
            .catch(() => { msg.innerHTML = '<span class="text-danger">Có lỗi xảy ra, vui lòng thử lại!</span>'; });
    }

    function removePayDiscount() {
        if (!confirm('Hủy mã giảm giá đang áp cho đơn này?')) return;
        fetch('/pos/waiting/' + billId + '/discount/remove', {
            method: 'POST',
            headers: csrfHeaders()
        })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) { alert(data.error || 'Không thể hủy mã giảm giá!'); return; }
                renderCart(data);
            })
            .catch(() => alert('Có lỗi xảy ra, vui lòng thử lại!'));
    }

    function updateItemQty(billDetailId, value, stock) {
        const qty = parseInt(value);
        if (isNaN(qty)) { loadCart(); return; }
        if (qty > stock) {
            alert('Số lượng vượt quá tồn kho (' + stock + ')!');
            loadCart();
            return;
        }
        submitQtyChange(billDetailId, qty);
    }

    function removeItem(billDetailId) {
        if (!confirm('Xóa sản phẩm này khỏi đơn?')) return;
        submitQtyChange(billDetailId, 0);
    }

    function submitQtyChange(billDetailId, qty) {
        fetch('/pos/waiting/' + billId + '/items/' + billDetailId + '/quantity?quantity=' + qty, {
            method: 'POST',
            headers: csrfHeaders()
        })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) { alert(data.error || 'Không thể cập nhật số lượng!'); loadCart(); return; }
                renderCart(data);
            })
            .catch(() => { alert('Có lỗi xảy ra, vui lòng thử lại!'); loadCart(); });
    }

    // ===== TÌM SẢN PHẨM MUA THÊM =====
    let addSearchTimer = null;
    document.getElementById('addProductSearch').addEventListener('input', function () {
        const kw = this.value.trim();
        clearTimeout(addSearchTimer);
        const dropdown = document.getElementById('addProductSuggest');
        if (!kw) { dropdown.classList.remove('show'); dropdown.innerHTML = ''; return; }

        addSearchTimer = setTimeout(() => {
            fetch('/pos/search-products?keyword=' + encodeURIComponent(kw))
                .then(r => r.json())
                .then(products => {
                    if (!products || products.length === 0) {
                        dropdown.innerHTML = '<div class="suggest-item text-muted">Không tìm thấy sản phẩm phù hợp</div>';
                        dropdown.classList.add('show');
                        return;
                    }
                    let html = '';
                    products.forEach(p => {
                        html += `<div class="suggest-item" onclick="pickAddProduct(${p.id}, '${escapeHtml(p.name).replace(/'/g, "\\'")}')">
                            <img src="${p.image}" onerror="this.src='/images/no-image.png'" style="width:28px;height:28px;object-fit:cover;border-radius:4px;">
                            <span>${escapeHtml(p.name)}</span>
                        </div>`;
                    });
                    dropdown.innerHTML = html;
                    dropdown.classList.add('show');
                })
                .catch(() => {});
        }, 300);
    });

    document.addEventListener('click', function (e) {
        const dropdown = document.getElementById('addProductSuggest');
        if (dropdown && !e.target.closest('#addProductSearch') && !e.target.closest('#addProductSuggest')) {
            dropdown.classList.remove('show');
        }
    });

    function pickAddProduct(productId, productName) {
        currentAddProductId = productId;
        document.getElementById('addProductSearch').value = productName;
        document.getElementById('addProductSuggest').classList.remove('show');
        document.getElementById('addVariantPicker').style.display = 'block';
        document.getElementById('addVariantList').innerHTML = '<span class="text-muted">Đang tải...</span>';
        document.getElementById('addVariantConfirm').style.display = 'none';
        selectedAddVariant = null;

        fetch('/pos/product-variants/' + productId)
            .then(r => r.json())
            .then(variants => {
                currentAddVariants = variants;
                if (!variants.length) {
                    document.getElementById('addVariantList').innerHTML = '<span class="text-danger">Không còn biến thể nào còn hàng!</span>';
                    return;
                }
                let html = '';
                variants.forEach((v, idx) => {
                    html += `<span class="variant-badge" onclick="selectAddVariant(${idx})">${escapeHtml(v.size)} / ${escapeHtml(v.color)} (tồn: ${v.quantity})</span>`;
                });
                document.getElementById('addVariantList').innerHTML = html;
            })
            .catch(() => {
                document.getElementById('addVariantList').innerHTML = '<span class="text-danger">Không thể tải biến thể!</span>';
            });
    }

    function selectAddVariant(idx) {
        selectedAddVariant = currentAddVariants[idx];
        document.querySelectorAll('#addVariantList .variant-badge').forEach((b, i) => b.classList.toggle('selected', i === idx));
        document.getElementById('addVariantQty').max = selectedAddVariant.quantity;
        document.getElementById('addVariantQty').value = 1;
        document.getElementById('addVariantConfirm').style.display = 'flex';
    }

    function confirmAddItem() {
        if (!selectedAddVariant) return;
        const qty = parseInt(document.getElementById('addVariantQty').value);
        if (!qty || qty < 1 || qty > selectedAddVariant.quantity) {
            alert('Số lượng không hợp lệ! Tồn kho: ' + selectedAddVariant.quantity);
            return;
        }

        const params = new URLSearchParams({ productDetailId: selectedAddVariant.id, quantity: qty });
        fetch('/pos/waiting/' + billId + '/items?' + params.toString(), {
            method: 'POST',
            headers: csrfHeaders()
        })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) { alert(data.error || 'Không thể thêm sản phẩm!'); return; }
                document.getElementById('addProductSearch').value = '';
                document.getElementById('addVariantPicker').style.display = 'none';
                renderCart(data);
            })
            .catch(() => alert('Có lỗi xảy ra, vui lòng thử lại!'));
    }

    loadCart();

    // ===== QR CHUYỂN KHOẢN =====
    const BANK_ID = 'MB';        // Thay bằng mã ngân hàng của shop (MB, VCB, TCB, ...)
    const ACCOUNT_NO = '0123456789'; // Thay bằng số tài khoản thật của shop
    const billCode = /*[[${bill.code}]]*/ '';

    function isTransferMethod(name) {
        if (!name) return false;
        const n = name.toLowerCase();
        return n.includes('chuyển') || n.includes('bank') || n.includes('ck') || n.includes('qr');
    }

    function onPaymentMethodChange(radio) {
        const methodName = radio.getAttribute('data-name') || '';
        const qrSection = document.getElementById('qrSection');
        const qrImage = document.getElementById('qrImage');
        if (isTransferMethod(methodName)) {
            const amount = document.getElementById('totalDisplay').textContent.replace(/[^\d]/g, '') || '0';
            const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(billCode)}`;
            qrImage.src = qrUrl;
            qrSection.style.display = 'block';
        } else {
            qrSection.style.display = 'none';
        }
    }

    // Kiểm tra phương thức mặc định sau khi loadCart xong
    function checkDefaultPaymentQR() {
        const checked = document.querySelector('input[name="paymentMethodId"]:checked');
        if (checked) onPaymentMethodChange(checked);
    }

    // Gọi sau khi cart load xong để amount có giá trị
    const origRenderCart = renderCart;
    renderCart = function(dto) {
        origRenderCart(dto);
        checkDefaultPaymentQR();
    };
</script>

<div th:replace="${isAdmin} ? ~{admin/fragments/layout :: adminScripts} : ~{staff/fragments/layout :: staffScripts}"></div>
</body>
</html>
