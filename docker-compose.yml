services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skysport-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skysport-db-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./docker/init:/init:ro
    entrypoint: ["/bin/bash", "/init/import.sh"]
    restart: "no"

  app:
    build: .
    container_name: skysport-app
    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: ${APP_PORT:-8080}
      DB_URL: jdbc:sqlserver://mssql:1433;databaseName=${DB_NAME:-SkySport};encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  mssql_data:
  uploads_data:
