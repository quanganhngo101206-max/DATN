<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn POS đang chờ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Đơn POS đang chờ</h3>

        <a href="/pos/create" class="btn btn-primary">
            Tạo đơn mới
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${#lists.isEmpty(waitingOrders)}"
         class="alert alert-secondary">
        Hiện không có đơn POS nào đang chờ.
    </div>

    <div th:if="${!#lists.isEmpty(waitingOrders)}"
         class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Khách hàng</th>
                <th>Thời gian tạo</th>
                <th>Giá trị</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="bill : ${waitingOrders}">

                <td th:text="${bill.code}"></td>

                <td>
                    <span th:if="${bill.customer != null}"
                          th:text="${bill.customer.name}">
                    </span>

                    <span th:if="${bill.customer == null}">
                        Khách lẻ
                    </span>
                </td>

                <td th:text="${bill.createDate}"></td>

                <td th:text="${bill.amount}"></td>

                <td>
                    <span class="badge bg-warning text-dark">
                        Chờ thanh toán
                    </span>
                </td>

                <td>

                    <!-- Tạm thời chưa resume -->
                    <button type="button"
                            class="btn btn-secondary btn-sm"
                            disabled>
                        Tiếp tục
                    </button>

                    <form th:action="@{'/pos/cancel/' + ${bill.id}}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Bạn có chắc muốn hủy đơn này?')">
                            Hủy
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
