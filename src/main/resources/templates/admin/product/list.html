<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý sản phẩm - SkySport</title>
    <th:block th:fragment="extraHead"><style>
        /* Giữ nguyên style cũ */
    </style></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('product')}"></div>

<div class="main-content">
    <!-- DEBUG: Kiểm tra dữ liệu -->
    <div style="background: yellow; padding: 10px; margin-bottom: 10px; display: none;">
        <p>product = <span th:text="${product != null ? 'OK' : 'NULL'}"></span></p>
        <p>products = <span th:text="${products != null ? products.size() : 'NULL'}"></span></p>
        <p>categories = <span th:text="${categories != null ? categories.size() : 'NULL'}"></span></p>
        <p>brands = <span th:text="${brands != null ? brands.size() : 'NULL'}"></span></p>
        <p>materials = <span th:text="${materials != null ? materials.size() : 'NULL'}"></span></p>
    </div>
    <h4 class="fw-bold mb-4">Quản lý sản phẩm</h4>
    <div class="row g-4">
        <!-- Form thêm/sửa -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-plus-circle"></i>
                    <span th:text="${product.id != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm'"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${product.id != null} ? '/admin/product/update' : '/admin/product/save'" method="post">
                        <input type="hidden" name="id" th:value="${product.id}"/>
                        <input type="hidden" name="deleteFlag" th:value="${product.deleteFlag}"/>
                        <input type="hidden" name="status" th:value="${product.status}"/>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã sản phẩm</label>
                            <input type="text" name="code" class="form-control" th:value="${product.code}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên sản phẩm</label>
                            <input type="text" name="name" class="form-control" th:value="${product.name}" required/>
                        </div>
                        <!-- ❌ ĐÃ XÓA input price -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Giới tính</label>
                            <select name="gender" class="form-select">
                                <option value="1" th:selected="${product.gender == 1}">Nam</option>
                                <option value="2" th:selected="${product.gender == 2}">Nữ</option>
                                <option value="3" th:selected="${product.gender == 3}">Unisex</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select name="categoryId" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                        th:selected="${product.category != null && product.category.id == cat.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Thương hiệu</label>
                            <select name="brandId" class="form-select" required>
                                <option value="">-- Chọn thương hiệu --</option>
                                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                                        th:selected="${product.brand != null && product.brand.id == b.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chất liệu</label>
                            <select name="materialId" class="form-select" required>
                                <option value="">-- Chọn chất liệu --</option>
                                <option th:each="m : ${materials}" th:value="${m.id}" th:text="${m.name}"
                                        th:selected="${product.material != null && product.material.id == m.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả</label>
                            <textarea name="describe" class="form-control" rows="3" th:text="${product.describe}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="1" th:selected="${product.status == 1}">Hoạt động</option>
                                <option value="0" th:selected="${product.status == 0}">Tắt</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">
                            <i class="bi bi-save"></i>
                            <span th:text="${product.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                        </button>
                        <a th:if="${product.id != null}" href="/admin/product" class="btn btn-secondary w-100 mt-2">Hủy</a>
                    </form>
                </div>
            </div>
        </div>

        <!-- Danh sách sản phẩm -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách sản phẩm</div>
                <div class="card-body p-3 pb-0">
                    <form th:action="@{/admin/product}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label mb-1" style="font-size:12px;">Tìm kiếm</label>
                            <input type="text" name="keyword" class="form-control form-control-sm"
                                   th:value="${keyword}" placeholder="Tên hoặc mã sản phẩm..."/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1" style="font-size:12px;">Danh mục</label>
                            <select name="categoryId" class="form-select form-select-sm">
                                <option value="">-- Tất cả --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                        th:selected="${selectedCategoryId != null && selectedCategoryId == cat.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label mb-1" style="font-size:12px;">Thương hiệu</label>
                            <select name="brandId" class="form-select form-select-sm">
                                <option value="">-- Tất cả --</option>
                                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                                        th:selected="${selectedBrandId != null && selectedBrandId == b.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label mb-1" style="font-size:12px;">Trạng thái</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">-- Tất cả --</option>
                                <option value="1" th:selected="${selectedStatus != null && selectedStatus == 1}">Hoạt động</option>
                                <option value="0" th:selected="${selectedStatus != null && selectedStatus == 0}">Tắt</option>
                            </select>
                        </div>
                        <div class="col-12 d-flex gap-2 mt-2">
                            <button type="submit" class="btn btn-sm btn-purple">
                                <i class="bi bi-search"></i> Tìm kiếm
                            </button>
                            <a th:href="@{/admin/product}" class="btn btn-sm btn-outline-secondary">Xóa lọc</a>
                            <span class="text-muted ms-auto align-self-center" style="font-size:12px;"
                                  th:text="'Tổng: ' + ${productPage.totalElements} + ' sản phẩm'"></span>
                        </div>
                    </form>
                </div>
                <div class="card-body p-0 mt-2">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Mã</th>
                            <th>Tên</th>
                            <th>Danh mục</th>
                            <th>Thương hiệu</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p, i : ${products}">
                            <td th:text="${productPage.number * productPage.size + i.count}"></td>
                            <td><span class="badge bg-secondary" th:text="${p.code}"></span></td>
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.category != null ? p.category.name : ''}"></td>
                            <td th:text="${p.brand != null ? p.brand.name : ''}"></td>
                            <td>
                                <a th:href="@{/admin/product/detail/{id}(id=${p.id})}" class="btn btn-sm btn-info text-white"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/admin/product/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/admin/product/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa sản phẩm này?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="text-center text-muted py-4">Không tìm thấy sản phẩm nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="card-footer d-flex align-items-center justify-content-between"
                     th:if="${productPage.totalPages > 1}">
                    <span class="text-muted" style="font-size:12px;"
                          th:text="'Trang ' + ${productPage.number + 1} + ' / ' + ${productPage.totalPages}"></span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${productPage.first} ? 'disabled' : ''">
                                <a class="page-link"
                                   th:href="@{/admin/product(keyword=${keyword}, categoryId=${selectedCategoryId}, brandId=${selectedBrandId}, status=${selectedStatus}, page=${productPage.number - 1}, size=${pageSize})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="pg : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                                th:classappend="${pg == productPage.number} ? 'active' : ''">
                                <a class="page-link"
                                   th:href="@{/admin/product(keyword=${keyword}, categoryId=${selectedCategoryId}, brandId=${selectedBrandId}, status=${selectedStatus}, page=${pg}, size=${pageSize})}"
                                   th:text="${pg + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${productPage.last} ? 'disabled' : ''">
                                <a class="page-link"
                                   th:href="@{/admin/product(keyword=${keyword}, categoryId=${selectedCategoryId}, brandId=${selectedBrandId}, status=${selectedStatus}, page=${productPage.number + 1}, size=${pageSize})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
</body>
</html>
