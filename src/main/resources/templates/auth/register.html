<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <h2 class="text-center mb-4">
                Đăng ký tài khoản
            </h2>

            <form th:action="@{/register}"
                  method="post"
                  th:object="${registerRequest}">

                <div class="mb-3">
                    <label class="form-label">
                        Tên đăng nhập
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{username}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Mật khẩu
                    </label>
                    <input type="password"
                           class="form-control"
                           th:field="*{password}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Họ và tên
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{fullName}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input type="email"
                           class="form-control"
                           th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Số điện thoại
                    </label>
                    <input type="text"
                           class="form-control"
                           th:field="*{phoneNumber}">
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Đăng ký
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
