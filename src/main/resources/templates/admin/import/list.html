<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Phiếu nhập hàng - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('import')}"></div>

<div class="main-content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-box-arrow-in-down me-2"></i>Phiếu nhập hàng</h4>
        <a href="/admin/import/create" class="btn btn-purple">
            <i class="bi bi-plus-lg me-1"></i>Tạo phiếu nhập
        </a>
    </div>

    <!-- Alert messages -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Bộ lọc trạng thái -->
    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${currentStatus == -1} ? 'active btn-purple' : ''" href="/admin/import">Tất cả</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${currentStatus == 1} ? 'active btn-purple' : ''" href="/admin/import?status=1">
                Chờ duyệt <span th:if="${pendingCount > 0}" class="badge bg-danger ms-1" th:text="${pendingCount}"></span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${currentStatus == 2} ? 'active btn-purple' : ''" href="/admin/import?status=2">Đã duyệt</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${currentStatus == 3} ? 'active btn-purple' : ''" href="/admin/import?status=3">Từ chối</a>
        </li>
    </ul>

    <!-- Danh sách phiếu nhập -->
    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul me-2"></i>Danh sách phiếu nhập</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã phiếu</th>
                    <th>Nhà cung cấp</th>
                    <th>Nhân viên tạo</th>
                    <th>Tổng tiền</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="fw-bold" th:text="${o.code}"></td>
                    <td th:text="${o.supplier != null ? o.supplier.name : '-'}"></td>
                    <td th:text="${o.staff != null ? o.staff.name : 'Admin'}"></td>
                    <td th:text="${#numbers.formatInteger(totalMap[o.id], 3, 'POINT') + ' đ'}"></td>
                    <td th:text="${#temporals.format(o.createDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:switch="${o.status}">
                            <span th:case="1" class="badge bg-warning text-dark">Chờ duyệt</span>
                            <span th:case="2" class="badge bg-success">Đã duyệt</span>
                            <span th:case="3" class="badge bg-danger">Từ chối</span>
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/admin/import/detail/{id}(id=${o.id})}" class="btn btn-sm btn-purple">
                            <i class="bi bi-eye"></i> Xem
                        </a>
                        <th:block th:if="${o.status == 1}">
                            <form th:action="@{/admin/import/approve/{id}(id=${o.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success ms-1"
                                        onclick="return confirm('Duyệt phiếu nhập này? Tồn kho sẽ được cộng thêm.')">
                                    <i class="bi bi-check-lg"></i> Duyệt
                                </button>
                            </form>
                            <button type="button" class="btn btn-sm btn-danger ms-1" data-bs-toggle="modal"
                                    th:data-bs-target="'#rejectModal' + ${o.id}">
                                <i class="bi bi-x-lg"></i> Từ chối
                            </button>

                            <!-- Modal từ chối -->
                            <div class="modal fade" th:id="'rejectModal' + ${o.id}" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <form th:action="@{/admin/import/reject/{id}(id=${o.id})}" method="post">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Từ chối phiếu nhập <span th:text="${o.code}"></span></h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <label class="form-label">Lý do từ chối</label>
                                                <textarea name="note" class="form-control" rows="3"
                                                          placeholder="Nhập lý do từ chối..."></textarea>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                                <button type="submit" class="btn btn-danger">Xác nhận từ chối</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Chưa có phiếu nhập nào
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
