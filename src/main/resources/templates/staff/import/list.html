<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments/layout :: staffHead(~{::title}, ~{::extraHead})}">
    <title>Nhập hàng - SkySport Staff</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{staff/fragments/layout :: staffSidebar('import')}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-box-arrow-in-down me-2"></i>Phiếu nhập hàng</h4>
        <a href="/staff/import/create" class="btn btn-purple">
            <i class="bi bi-plus-lg me-1"></i>Tạo phiếu nhập
        </a>
    </div>

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul me-2"></i>Danh sách phiếu nhập</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã phiếu</th>
                    <th>Nhà cung cấp</th>
                    <th>Tổng tiền</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="fw-bold" th:text="${o.code}"></td>
                    <td th:text="${o.supplier != null ? o.supplier.name : '-'}"></td>
                    <td th:text="${#numbers.formatInteger(totalMap[o.id], 0, 'COMMA') + 'đ'}"></td>
                    <td th:text="${#temporals.format(o.createDate, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                            <span th:switch="${o.status}">
                                <span th:case="1" class="badge bg-warning text-dark">Chờ duyệt</span>
                                <span th:case="2" class="badge bg-success">Đã duyệt</span>
                                <span th:case="3" class="badge bg-danger">Từ chối</span>
                            </span>
                    </td>
                    <td>
                        <a th:href="@{/staff/import/detail/{id}(id=${o.id})}"
                           class="btn btn-sm btn-purple"><i class="bi bi-eye"></i> Xem</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có phiếu nhập nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{staff/fragments/layout :: staffScripts}"></div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
