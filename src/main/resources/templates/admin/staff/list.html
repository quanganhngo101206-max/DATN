<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý nhân viên - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('staff')}"></div>

<div class="main-content">
    <h4 class="fw-bold mb-4">Quản lý nhân viên</h4>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-plus-circle"></i>
                    <span th:text="${staff.id != null} ? 'Sửa nhân viên' : 'Thêm nhân viên'"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${staff.id != null} ? '/admin/staff/update' : '/admin/staff/save'" method="post">
                        <input type="hidden" name="id" th:value="${staff.id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã nhân viên</label>
                            <input type="text" name="code" class="form-control" th:value="${staff.code}" placeholder="VD: NV001..." required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên nhân viên</label>
                            <input type="text" name="name" class="form-control" th:value="${staff.name}" placeholder="VD: Nguyễn Văn A..." required/>
                        </div>
                        <div th:if="${staff.id == null}">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập</label>
                                <input type="text" name="username" class="form-control" placeholder="VD: nhanvien3..." required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu</label>
                                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required/>
                            </div>
                        </div>
                        <div th:if="${staff.id != null}" class="mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="1" th:selected="${staff.status == 1}">Hoạt động</option>
                                <option value="0" th:selected="${staff.status == 0}">Tắt</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">
                            <i class="bi bi-save"></i>
                            <span th:text="${staff.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                        </button>
                        <a th:if="${staff.id != null}" href="/admin/staff" class="btn btn-secondary w-100 mt-2">Hủy</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách nhân viên</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>#</th><th>Mã</th><th>Tên</th><th>Tài khoản</th><th>Trạng thái TK</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="s, i : ${staffs}">
                            <td th:text="${i.count}"></td>
                            <td><span class="badge bg-secondary" th:text="${s.code}"></span></td>
                            <td th:text="${s.name}"></td>
                            <td th:text="${s.account != null ? s.account.username : ''}"></td>
                            <td>
                                <span class="badge bg-success" th:if="${s.account != null && s.account.status == 1}">Hoạt động</span>
                                <span class="badge bg-danger" th:if="${s.account != null && s.account.status == 0}">Bị khóa</span>
                                <span class="badge bg-warning text-dark" th:if="${s.account != null && s.account.isNonLocked == false}">🔒 Khóa do đăng nhập sai</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/staff/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/admin/staff/toggle/{id}(id=${s.id})}" class="btn btn-sm" th:classappend="${s.account != null && s.account.status == 1} ? 'btn-danger' : 'btn-success'" th:text="${s.account != null && s.account.status == 1} ? '🔒 Khóa' : '🔓 Mở'"></a>
                                <a th:href="@{/admin/staff/unlock/{id}(id=${s.id})}" class="btn btn-sm btn-outline-warning" th:if="${s.account != null && s.account.isNonLocked == false}">Mở khóa đăng nhập</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(staffs)}">
                            <td colspan="6" class="text-center text-muted py-4">Chưa có nhân viên nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
</body>
</html>
