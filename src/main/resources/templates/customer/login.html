<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Đăng nhập - SkySport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            width: 460px;
            max-width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: 2px;
        }

        .logo h1 span {
            color: #e94560;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .tab-container {
            display: flex;
            background: #f1f3f5;
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border: none;
            background: transparent;
            transition: all 0.3s;
        }

        .tab.active {
            background: #1a1a2e;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tab.active i {
            color: #e94560;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group label i {
            color: #e94560;
            margin-right: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #c62a47;
            transform: translateY(-2px);
        }

        .error {
            background: #ffe0e0;
            color: #e53935;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13px;
            margin-bottom: 20px;
            border-left: 4px solid #e53935;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .register-link a {
            color: #e94560;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .guest-link {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .guest-link a {
            color: #999;
            font-size: 13px;
            text-decoration: none;
        }

        .guest-link a:hover {
            color: #e94560;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Logo -->
    <div class="logo">
        <h1>⚡ <span>SKYSPORT</span></h1>
        <p>Thể thao đỉnh cao - Phong cách riêng bạn</p>
    </div>

    <!-- Tab chọn loại đăng nhập -->
    <div class="tab-container">
        <button class="tab active" id="tab-customer" onclick="switchTab('customer')">
            <i class="bi bi-person"></i> Khách hàng
        </button>
        <button class="tab" id="tab-admin" onclick="switchTab('admin')">
            <i class="bi bi-shield-lock"></i> Quản lý / NV
        </button>
    </div>

    <!-- Thông báo lỗi -->
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <!-- Form đăng nhập -->
    <form method="post" th:action="@{/login}">
        <input type="hidden" name="type" id="loginType" value="customer"/>

        <div class="form-group">
            <label><i class="bi bi-envelope"></i> Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập..." required/>
        </div>

        <div class="form-group">
            <label><i class="bi bi-lock"></i> Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu..." required/>
        </div>

        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i> ĐĂNG NHẬP
        </button>
    </form>

    <!-- Link đăng ký (chỉ hiện với khách hàng) -->
    <div class="register-link" id="registerLink">
        Chưa có tài khoản?
        <a href="/register">Đăng ký ngay</a>
    </div>

    <!-- Nút bỏ qua cho Guest -->
    <div class="guest-link" id="guestLink">
        <a href="/home">
            <i class="bi bi-arrow-right"></i> Bỏ qua, tiếp tục xem hàng
        </a>
    </div>
</div>

<script>
    function switchTab(type) {
        document.getElementById('loginType').value = type;

        // Cập nhật active class
        document.getElementById('tab-customer').classList.remove('active');
        document.getElementById('tab-admin').classList.remove('active');
        document.getElementById('tab-' + type).classList.add('active');

        // Ẩn/hiện link đăng ký và guest
        if (type === 'admin') {
            document.getElementById('registerLink').style.display = 'none';
            document.getElementById('guestLink').style.display = 'none';
        } else {
            document.getElementById('registerLink').style.display = 'block';
            document.getElementById('guestLink').style.display = 'block';
        }
    }
</script>
</body>
</html>
