<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý thương hiệu - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('brand')}"></div>

<div class="main-content">
    <h4 class="fw-bold mb-4">Quản lý thương hiệu</h4>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-plus-circle"></i>
                    <span th:text="${brand.id != null} ? 'Sửa thương hiệu' : 'Thêm thương hiệu'"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${brand.id != null} ? '/admin/brand/update' : '/admin/brand/save'" method="post">
                        <input type="hidden" name="id" th:value="${brand.id}"/>
                        <input type="hidden" name="deleteFlag" th:value="${brand.deleteFlag}"/>
                        <input type="hidden" name="status" th:value="${brand.status}"/>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mã thương hiệu</label>
                            <input type="text" name="code" class="form-control" th:value="${brand.code}" placeholder="VD: NK, AD..." required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên thương hiệu</label>
                            <input type="text" name="name" class="form-control" th:value="${brand.name}" placeholder="VD: Nike, Adidas..." required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="1" th:selected="${brand.status == 1}">Hoạt động</option>
                                <option value="0" th:selected="${brand.status == 0}">Tắt</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-purple w-100">
                            <i class="bi bi-save"></i>
                            <span th:text="${brand.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                        </button>
                        <a th:if="${brand.id != null}" href="/admin/brand" class="btn btn-secondary w-100 mt-2">Hủy</a>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách thương hiệu</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr><th>#</th><th>Mã</th><th>Tên</th><th>Trạng thái</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="b, i : ${brands}">
                            <td th:text="${i.count}"></td>
                            <td><span class="badge bg-secondary" th:text="${b.code}"></span></td>
                            <td th:text="${b.name}"></td>
                            <td>
                                <span class="badge bg-success" th:if="${b.status == 1}">Hoạt động</span>
                                <span class="badge bg-danger" th:if="${b.status == 0}">Tắt</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/brand/edit/{id}(id=${b.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/admin/brand/delete/{id}(id=${b.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa thương hiệu này?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(brands)}">
                            <td colspan="5" class="text-center text-muted py-4">Chưa có thương hiệu nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
</body>
</html>
