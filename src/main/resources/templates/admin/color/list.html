<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý màu sắc - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('color')}"></div>

<div class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-bold mb-0">Quản lý màu sắc</h4>
        <button type="button" class="btn btn-purple" data-bs-toggle="modal" data-bs-target="#colorModal"
                onclick="openCreateModal()">
            <i class="bi bi-plus-circle"></i> Thêm màu sắc
        </button>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách màu sắc</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:each="c, i : ${colors}">
                    <td th:text="${i.count}"></td>
                    <td><span class="badge bg-secondary" th:text="${c.code}"></span></td>
                    <td th:text="${c.name}"></td>
                    <td>
                        <a th:href="@{/admin/color/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/admin/color/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa màu này?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(colors)}">
                    <td colspan="4" class="text-center text-muted py-4">Chưa có màu nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal thêm / sửa màu sắc -->
<div class="modal fade" id="colorModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="${color.id != null} ? '/admin/color/update' : '/admin/color/save'" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle"></i>
                        <span th:text="${color.id != null} ? 'Sửa màu sắc' : 'Thêm màu sắc'"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" th:value="${color.id}"/>
                    <input type="hidden" name="deleteFlag" th:value="${color.deleteFlag}"/>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mã màu</label>
                        <input type="text" name="code" class="form-control" th:value="${color.code}" placeholder="VD: DO, XANH..." required/>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold">Tên màu</label>
                        <input type="text" name="name" class="form-control" th:value="${color.name}" placeholder="VD: Đỏ, Xanh..." required/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            th:onclick="${color.id != null} ? 'window.location=\'/admin/color\'' : ''">Hủy</button>
                    <button type="submit" class="btn btn-purple">
                        <i class="bi bi-save"></i>
                        <span th:text="${color.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
<script th:inline="javascript">
    function openCreateModal() {
        var form = document.querySelector('#colorModal form');
        form.reset();
        form.setAttribute('action', '/admin/color/save');
        form.querySelector('input[name=id]').value = '';
        document.querySelector('#colorModal .modal-title span').textContent = 'Thêm màu sắc';
    }

    /*<![CDATA[*/
    var shouldOpenModal = /*[[${openModal != null && openModal}]]*/ false;
    /*]]>*/
    if (shouldOpenModal) {
        document.addEventListener('DOMContentLoaded', function () {
            new bootstrap.Modal(document.getElementById('colorModal')).show();
        });
    }
</script>
</body>
</html>
