<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: adminHead(~{::title}, ~{::extraHead})}">
    <title>Quản lý Size - SkySport</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: adminSidebar('size')}"></div>

<div class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-bold mb-0">Quản lý Size</h4>
        <button type="button" class="btn btn-purple" data-bs-toggle="modal" data-bs-target="#sizeModal"
                onclick="openCreateModal()">
            <i class="bi bi-plus-circle"></i> Thêm size
        </button>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-list-ul"></i> Danh sách size</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>#</th><th>Mã</th><th>Tên</th><th>Thao tác</th></tr>
                </thead>
                <tbody>
                <tr th:each="s, i : ${sizes}">
                    <td th:text="${i.count}"></td>
                    <td><span class="badge bg-secondary" th:text="${s.code}"></span></td>
                    <td th:text="${s.name}"></td>
                    <td>
                        <a th:href="@{/admin/size/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/admin/size/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa size này?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sizes)}">
                    <td colspan="4" class="text-center text-muted py-4">Chưa có size nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal thêm / sửa size -->
<div class="modal fade" id="sizeModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="${size.id != null} ? '/admin/size/update' : '/admin/size/save'" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle"></i>
                        <span th:text="${size.id != null} ? 'Sửa size' : 'Thêm size'"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" th:value="${size.id}"/>
                    <input type="hidden" name="deleteFlag" th:value="${size.deleteFlag}"/>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mã size</label>
                        <input type="text" name="code" class="form-control" th:value="${size.code}" placeholder="VD: S, M, L..." required/>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold">Tên size</label>
                        <input type="text" name="name" class="form-control" th:value="${size.name}" placeholder="VD: Small, Medium..." required/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            th:onclick="${size.id != null} ? 'window.location=\'/admin/size\'' : ''">Hủy</button>
                    <button type="submit" class="btn btn-purple">
                        <i class="bi bi-save"></i>
                        <span th:text="${size.id != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: adminScripts}"></div>
<script th:inline="javascript">
    function openCreateModal() {
        var form = document.querySelector('#sizeModal form');
        form.reset();
        form.setAttribute('action', '/admin/size/save');
        form.querySelector('input[name=id]').value = '';
        document.querySelector('#sizeModal .modal-title span').textContent = 'Thêm size';
    }

    /*<![CDATA[*/
    var shouldOpenModal = /*[[${openModal != null && openModal}]]*/ false;
    /*]]>*/
    if (shouldOpenModal) {
        document.addEventListener('DOMContentLoaded', function () {
            new bootstrap.Modal(document.getElementById('sizeModal')).show();
        });
    }
</script>
</body>
</html>
