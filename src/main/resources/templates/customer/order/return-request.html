<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Yêu cầu trả hàng - SkySport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f7f9fc;
        }

        .navbar {
            background: #1a1a2e;
            padding: 16px 0;
        }

        .navbar-brand {
            font-size: 26px;
            font-weight: 800;
            color: #e94560 !important;
        }

        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px 0;
            text-align: center;
            color: white;
        }

        .page-header h1 {
            font-size: 34px;
            font-weight: 800;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .card-header {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 15px 20px;
            font-weight: 700;
            border-radius: 20px 20px 0 0 !important;
        }

        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-name {
            font-weight: 700;
            color: #1a1a2e;
        }

        .btn-danger-custom {
            background: #e94560;
            color: white;
            border: none;
        }

        .btn-danger-custom:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/home"><i class="bi bi-lightning-charge-fill"></i> SKYSPORT</a>
    </div>
</nav>

<section class="page-header">
    <div class="container">
        <h1><i class="bi bi-arrow-return-left"></i> Yêu cầu trả hàng</h1>
        <p th:text="'Đơn hàng: ' + ${bill.code}"></p>
    </div>
</section>

<div class="container py-5">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/customer/order/return/{id}(id=${bill.id})}" method="post">
        <div class="card">
            <div class="card-header"><i class="bi bi-box-seam me-2"></i>Chọn sản phẩm muốn trả</div>
            <div class="card-body p-0">
                <table class="table mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:40px;"></th>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>SL đã mua</th>
                        <th style="width:140px;">SL muốn trả</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${details}">
                        <td>
                            <input type="checkbox" class="form-check-input return-check"
                                   th:data-target="'qty_' + ${d.id}">
                            <input type="hidden" name="billDetailIds" th:value="${d.id}">
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div>
                                    <div class="product-name" th:text="${d.productDetail.product.name}"></div>
                                    <div class="text-muted small">
                                        <span th:if="${d.productDetail.color != null}"
                                              th:text="'Màu: ' + ${d.productDetail.color.name}"></span>
                                        <span th:if="${d.productDetail.size != null}"
                                              th:text="' | Size: ' + ${d.productDetail.size.name}"></span>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${#numbers.formatInteger(d.momentPrice, 0, 'COMMA') + 'đ'}"></td>
                        <td th:text="${d.quantity}"></td>
                        <td>
                            <input type="number" name="returnQuantities" class="form-control"
                                   th:id="'qty_' + ${d.id}"
                                   min="0" th:max="${d.quantity}" value="0" readonly>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(details)}">
                        <td colspan="5" class="text-center text-muted py-4">Không có sản phẩm</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="bi bi-chat-left-text me-2"></i>Lý do trả hàng</div>
            <div class="card-body">
                <textarea class="form-control" rows="3"
                          placeholder="Mô tả lý do trả hàng (sản phẩm lỗi, không đúng mô tả...)"></textarea>
                <small class="text-muted">Lý do này sẽ được trao đổi trực tiếp với bộ phận chăm sóc khách hàng khi xử lý
                    yêu cầu.</small>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/customer/order/detail/{id}(id=${bill.id})}" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
            <button type="submit" class="btn btn-danger-custom rounded-pill px-4">
                <i class="bi bi-send"></i> Gửi yêu cầu trả hàng
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.return-check').forEach(cb => {
        cb.addEventListener('change', function () {
            const qtyInput = document.getElementById(this.dataset.target);
            if (this.checked) {
                qtyInput.removeAttribute('readonly');
                qtyInput.value = qtyInput.max;
                qtyInput.focus();
            } else {
                qtyInput.setAttribute('readonly', 'readonly');
                qtyInput.value = 0;
            }
        });
    });
</script>
</body>
</html>
