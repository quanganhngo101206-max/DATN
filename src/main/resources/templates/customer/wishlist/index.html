<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sản phẩm yêu thích - SkySport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f7f9fc;
        }

        .navbar {
            background: #1a1a2e;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 26px;
            font-weight: 800;
            color: #e94560 !important;
        }

        .nav-link {
            color: #eee !important;
            font-weight: 500;
            margin: 0 12px;
        }

        .nav-link:hover {
            color: #e94560 !important;
        }

        .btn-nav {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
        }

        .cart-icon, .wishlist-icon {
            position: relative;
            font-size: 22px;
            color: white;
            text-decoration: none;
        }

        .cart-badge, .wishlist-badge {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #e94560;
            border-radius: 50%;
            font-size: 10px;
            padding: 2px 6px;
        }

        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 50px 0;
            text-align: center;
            color: white;
        }

        .page-header h1 {
            font-size: 42px;
            font-weight: 800;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-name {
            font-weight: 700;
            color: #1a1a2e;
        }

        .product-price {
            color: #e94560;
            font-weight: 800;
            font-size: 18px;
        }

        .btn-remove-wish {
            background: none;
            border: 1px solid #e94560;
            color: #e94560;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-remove-wish:hover {
            background: #e94560;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 60px;
            color: #ddd;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            min-width: 300px;
        }

        .toast-success {
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .toast-error {
            background: #ef4444;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div id="toastMessage" class="toast-message" style="display:none;"></div>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/home"><i class="bi bi-lightning-charge-fill"></i> SKYSPORT</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="/home" class="nav-link">Trang chủ</a>
            <a href="/products" class="nav-link">Sản phẩm</a>
            <a href="/wishlist" class="wishlist-icon">
                <i class="bi bi-heart-fill" style="color:#e94560;"></i>
                <span class="wishlist-badge" th:text="${wishlistCount != null ? wishlistCount : 0}">0</span>
            </a>
            <a href="/cart" class="cart-icon">
                <i class="bi bi-cart3"></i>
                <span class="cart-badge" th:text="${cartCount != null ? cartCount : 0}">0</span>
            </a>
            <th:block th:if="${session.account != null}">
                <div class="dropdown">
                    <button class="btn-nav dropdown-toggle" data-bs-toggle="dropdown">
                        <span th:text="${session.account.username}"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/profile">Tài khoản</a></li>
                        <li><a class="dropdown-item" href="/customer/orders">Đơn hàng</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="/logout">Đăng xuất</a></li>
                    </ul>
                </div>
            </th:block>
            <th:block th:if="${session.account == null}">
                <a href="/login" class="btn-nav">Đăng nhập</a>
            </th:block>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container">
        <h1><i class="bi bi-heart"></i> Sản phẩm yêu thích</h1>
        <p th:text="${wishlistCount + ' sản phẩm'}"></p>
    </div>
</section>

<div class="container py-5">

    <div th:if="${#lists.isEmpty(wishlistDetails)}" class="empty-state">
        <i class="bi bi-heart"></i>
        <h4 class="mt-3 mb-2">Danh sách yêu thích trống</h4>
        <p>Hãy khám phá sản phẩm và thêm vào danh sách yêu thích của bạn!</p>
        <a href="/products" class="btn-nav d-inline-block mt-3">Khám phá sản phẩm</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(wishlistDetails)}">
        <div class="col-md-3" th:each="wd : ${wishlistDetails}" th:id="'wish-card-' + ${wd.product.id}">
            <div class="product-card">
                <a th:href="@{/products/{id}(id=${wd.product.id})}">
                    <img class="product-img"
                         th:src="${productImages[wd.product.id] != null ? productImages[wd.product.id] : 'https://placehold.co/300x220/e9ecef/6c757d?text=No+Image'}"
                         th:alt="${wd.product.name}">
                </a>
                <div class="p-3">
                    <div class="product-name" th:text="${wd.product.name}"></div>
                    <div class="product-price mb-2"
                         th:text="${#numbers.formatInteger(productPrices[wd.product.id], 0, 'COMMA') + 'đ'}"></div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/products/{id}(id=${wd.product.id})}" class="btn btn-sm btn-nav">Xem chi tiết</a>
                        <button class="btn-remove-wish" th:data-product-id="${wd.product.id}"
                                onclick="removeFromWishlist(this)">
                            <i class="bi bi-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type) {
        const toastDiv = document.getElementById('toastMessage');
        toastDiv.innerHTML = `<div class="toast-${type}">
        <i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill'}"></i>
        <span>${message}</span>
    </div>`;
        toastDiv.style.display = 'block';
        setTimeout(() => {
            toastDiv.style.display = 'none';
        }, 3000);
    }

    function removeFromWishlist(btn) {
        const productId = btn.dataset.productId;
        fetch('/wishlist/remove/' + productId, {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('wish-card-' + productId).remove();
                    document.querySelector('.wishlist-badge').innerText = data.wishlistCount;
                    showToast(data.message, 'success');  // ← thay alert
                } else {
                    showToast(data.message || 'Có lỗi xảy ra!', 'error');  // ← thay alert
                }
            })
            .catch(() => showToast('Có lỗi xảy ra!', 'error'));  // ← thay alert
    }
</script>
</body>
</html>
