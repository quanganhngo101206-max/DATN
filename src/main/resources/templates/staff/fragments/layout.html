<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- =====================================================
     FRAGMENT: staffHead
     Usage: <head th:replace="~{staff/fragments/layout :: staffHead(~{::title}, ~{::extraHead})}">
     ===================================================== -->
<head th:fragment="staffHead(pageTitle, extraStyles)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="${pageTitle}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0c1a2e;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #162032;
            --sidebar-active-bg: rgba(16,185,129,0.15);
            --sidebar-active-color: #6ee7b7;
            --brand-primary: #10b981;
            --brand-dark: #059669;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.07);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--surface-2); font-family: 'Inter','Segoe UI',sans-serif; color: var(--text-primary); font-size: 14px; }

        /* SIDEBAR */
        .sidebar {
            background: var(--sidebar-bg);
            min-height: 100vh; position: fixed; width: 248px;
            display: flex; flex-direction: column; z-index: 100;
        }
        .sidebar-logo {
            padding: 22px 20px 18px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo-icon {
            width: 34px; height: 34px; background: var(--brand-primary);
            border-radius: 8px; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 16px; flex-shrink: 0;
        }
        .logo-text { font-size: 16px; font-weight: 800; color: white; letter-spacing: 0.5px; line-height: 1; }
        .logo-sub { font-size: 10px; color: var(--sidebar-text); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .sidebar-nav { padding: 14px 0; flex: 1; overflow-y: auto; }
        .nav-section {
            font-size: 10px; font-weight: 600; color: rgba(148,163,184,0.45);
            text-transform: uppercase; letter-spacing: 1.2px; padding: 14px 20px 5px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 20px; color: var(--sidebar-text);
            text-decoration: none; font-size: 13.5px; font-weight: 400;
            transition: all 0.2s ease; position: relative;
        }
        .nav-item:hover { background: var(--sidebar-hover); color: #e2e8f0; }
        .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-color); }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--brand-primary); border-radius: 0 2px 2px 0;
        }
        .nav-item i { font-size: 16px; width: 20px; flex-shrink: 0; }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 20px; }
        .sidebar-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06); }

        /* MAIN */
        .main-content { margin-left: 248px; padding: 24px 28px; min-height: 100vh; }

        /* CARDS */
        .card { border: 1px solid var(--border) !important; border-radius: var(--radius) !important; box-shadow: var(--shadow-sm) !important; margin-bottom: 20px; }
        .card-header {
            background: var(--sidebar-bg) !important;
            color: white !important;
            border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0 !important;
            padding: 14px 20px !important; font-weight: 600 !important;
            border-bottom: none !important; font-size: 14px;
        }
        .card-header i { margin-right: 8px; }

        /* BUTTONS */
        .btn-purple { background: var(--brand-primary); color: white; border: none; border-radius: var(--radius-sm); }
        .btn-purple:hover { background: var(--brand-dark); color: white; }

        /* TABLE */
        .table { font-size: 13.5px; }
        .table thead th {
            background: var(--surface-2) !important; color: var(--text-secondary);
            font-size: 11.5px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 11px 16px; border-bottom: 1px solid var(--border);
        }
        .table tbody td { padding: 12px 16px; vertical-align: middle; border-color: var(--border); }
        .table-hover tbody tr:hover { background: var(--surface-2); }

        /* FORM */
        .form-control, .form-select {
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 13.5px; padding: 8px 12px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }
        .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

        /* STAT CARDS */
        .stat-card {
            background: white; border-radius: var(--radius); padding: 20px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            border-left: 4px solid; transition: box-shadow 0.2s, transform 0.2s;
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-card .icon { font-size: 36px; opacity: 0.7; }
        .stat-card .value { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .stat-card .label { color: var(--text-secondary); font-size: 13px; }
    </style>
    <th:block th:replace="${extraStyles}"/>
</head>

<!-- =====================================================
     FRAGMENT: staffSidebar
     activeMenu values: dashboard, bill, import, discount, return
     ===================================================== -->
<div th:fragment="staffSidebar(activeMenu)">
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
            <div>
                <div class="logo-text">SKYSPORT</div>
                <div class="logo-sub">Nhân viên</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Tổng quan</div>
            <a class="nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active'" href="/staff/dashboard">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <div class="nav-section">Nghiệp vụ</div>
            <a class="nav-item" th:classappend="${activeMenu == 'bill'} ? 'active'" href="/staff/bill">
                <i class="bi bi-receipt-cutoff"></i> Đơn hàng
                <span th:if="${newOrderCount > 0}" class="ms-auto badge"
                      style="background:#ef4444;color:white;font-size:10px;padding:2px 7px;border-radius:10px;"
                      th:text="${newOrderCount}"></span>
            </a>
            <a class="nav-item" th:classappend="${activeMenu == 'import'} ? 'active'" href="/staff/import">
                <i class="bi bi-box-arrow-in-down"></i> Nhập hàng
            </a>
            <a class="nav-item" th:classappend="${activeMenu == 'discount'} ? 'active'" href="/staff/discount">
                <i class="bi bi-ticket-perforated"></i> Voucher
            </a>
            <a class="nav-item" th:classappend="${activeMenu == 'return'} ? 'active'" href="/staff/return">
                <i class="bi bi-arrow-return-left"></i> Hoàn trả
            </a>
            <a class="nav-item" th:classappend="${activeMenu == 'order'} ? 'active'" href="/staff/order/create">
                <i class="bi bi-cart-plus"></i> Bán tại quầy
            </a>

            <div class="nav-divider"></div>
            <a class="nav-item" href="/admin/dashboard"><i class="bi bi-shield-lock"></i> Giao diện Admin</a>
            <a class="nav-item" href="/home"><i class="bi bi-globe2"></i> Website</a>
        </nav>
        <div class="sidebar-footer">
            <a class="nav-item" href="/logout" style="padding:8px 0;color:#f87171;">
                <i class="bi bi-box-arrow-right"></i> Đăng xuất
            </a>
        </div>
    </div>
</div>

<!-- =====================================================
     FRAGMENT: staffScripts
     ===================================================== -->
<div th:fragment="staffScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
